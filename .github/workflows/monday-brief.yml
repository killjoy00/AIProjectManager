name: monday-brief

# Monday 07:00 US Central, anchored to CDT (UTC-5) — see the note in nightly-triage.yml.
# The most important output of the system. Structure is enforced by scripts/post-brief.mjs
# against docs/WEEKLY-BRIEF.md, not left to the model.

on:
  schedule:
    # :23, not :00 — see the note in nightly-triage.yml. Monday 12:23 UTC is 07:23 CT.
    - cron: "23 12 * * 1"
  workflow_dispatch:
    inputs:
      # GitHub renders the description, not the input name, so each one names itself.
      dry_run:
        description: "dry_run — render the brief to the log, post nothing (safe test)"
        type: boolean
        default: false
      simulate_failure:
        description: "simulate_failure — deliberately fail, to check the alert fires (leaves an issue)"
        type: boolean
        default: false

concurrency:
  group: monday-brief
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Simulate failure (test the alerting path)
        if: inputs.simulate_failure
        run: |
          echo "Deliberate failure requested via workflow_dispatch."
          exit 1

      - name: Collect context
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: node scripts/collect-context.mjs

      # Measured, not authored — §5 numbers are injected by the renderer so they can't be invented.
      - name: Collect metrics
        run: node scripts/collect-metrics.mjs

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # See the note in nightly-triage.yml — a copied-out token often carries a line wrap.
      - name: Normalize agent credential
        env:
          RAW_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RAW_APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          normalize () {
            raw="$2"
            [ -z "$raw" ] && return 0
            clean=$(printf '%s' "$raw" | tr -d '[:space:]')
            echo "::add-mask::$clean"
            echo "$1=$clean" >> "$GITHUB_ENV"
            if [ "${#clean}" -ne "${#raw}" ]; then
              echo "::warning::$1 contained whitespace (likely a line wrap when it was copied)." \
                   "Using the stripped value. Consider re-pasting it as one unbroken line."
            fi
          }
          normalize CLAUDE_CODE_OAUTH_TOKEN "$RAW_OAUTH"
          normalize ANTHROPIC_API_KEY       "$RAW_APIKEY"
          if [ -z "$RAW_OAUTH" ] && [ -z "$RAW_APIKEY" ]; then
            echo "::error::No agent credential set. Add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY."
            exit 1
          fi

      # No `env:` here on purpose — credentials arrive from the normalize step via GITHUB_ENV.
      - name: Run brief agent
        run: |
          # pipefail: without it the pipeline reports tee's status, masking a failing `claude`.
          set -o pipefail
          claude -p "$(cat docs/prompts/monday-brief.md)" \
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch" \
            --permission-mode acceptEdits \
            --max-turns 50 \
            --output-format text \
            2>&1 | tee .agent/agent.log

      - name: Verify the agent produced output
        run: |
          if [ ! -s .agent/brief.json ]; then
            echo "::error::Agent did not write .agent/brief.json — treating as a failed run."
            exit 1
          fi
          node -e "
            const b = JSON.parse(require('fs').readFileSync('.agent/brief.json','utf8'));
            if (Array.isArray(b.drive)) {
              console.error('::error::drive must be a single object, not a list. The spec says exactly one.');
              process.exit(1);
            }
            if (!b.drive || typeof b.drive !== 'object') {
              console.error('::error::brief.json has no drive object');
              process.exit(1);
            }
          "

      - name: Post brief
        if: ${{ !inputs.dry_run }}
        run: node scripts/post-brief.mjs

      - name: Dry run — render without posting
        if: ${{ inputs.dry_run }}
        env:
          DRY_RUN: "true"
        run: node scripts/post-brief.mjs

      - name: Heartbeat
        if: success() && !inputs.dry_run
        env:
          HEARTBEAT_URL: ${{ vars.HEARTBEAT_URL }}
          HEARTBEAT_SECRET: ${{ secrets.HEARTBEAT_SECRET }}
          HEARTBEAT_JOB: monday-brief
        run: node scripts/heartbeat.mjs

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_id }}
          path: .agent/
          retention-days: 30
          if-no-files-found: warn
          # .agent is dot-prefixed — hidden files are excluded by default.
          include-hidden-files: true

      - name: Report failure
        if: failure()
        env:
          FAILED_JOB: monday-brief
        run: node scripts/report-failure.mjs
